<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Periodic Table Card Tile -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <rect width="384" height="384" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="12"/>
    
    <!-- Element number & badge -->
    <rect x="24" y="24" width="70" height="32" rx="16" fill="#fef08a" stroke="#1e293b" stroke-width="4"/>
    <text x="59" y="46" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#1e293b">11</text>
    
    <text x="350" y="48" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="end" fill="#64748b">22.99</text>
    
    <!-- Main Element Symbol -->
    <text x="192" y="220" font-family="system-ui, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#2563eb">Na</text>
    
    <!-- Element Thai Name -->
    <text x="192" y="280" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle" fill="#0f172a">โซเดียม</text>
    
    <!-- Atomic Category Badge -->
    <g transform="translate(72, 310)">
      <rect width="240" height="42" rx="21" fill="#fee2e2" stroke="#1e293b" stroke-width="4"/>
      <text x="120" y="27" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#b91c1c">โลหะแอลคาไล ⚡</text>
    </g>
  </g>
  
  <!-- Sparkles -->
  <circle cx="90" cy="90" r="14" fill="#fef08a" stroke="#1e293b" stroke-width="4"/>
  <circle cx="420" cy="110" r="18" fill="#f472b6" stroke="#1e293b" stroke-width="4"/>
  <circle cx="430" cy="420" r="12" fill="#4ade80" stroke="#1e293b" stroke-width="4"/>
</svg>
